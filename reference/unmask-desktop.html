    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    z-index: 5;
    opacity: 0.96;
  }
  .hint .eyebrow {
    font-size: 13px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(220,210,255,0.7);
    margin-bottom: 12px;
    font-weight: 500;
    text-shadow: 0 1px 10px rgba(0,0,0,0.9);
  }
  .hint .name {
    font-size: 40px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: #F5F2FA;
    text-shadow: 0 2px 20px rgba(0,0,0,0.95);
  }
  .hint .rule {
    width: 44px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(200,180,255,0.55), transparent);
    margin: 18px auto 0;
  }

  .lock-btn {
    position: absolute;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    display: flex; align-items: center; gap: 10px;
    padding: 14px 30px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(12,10,18,0.5);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    color: #EDEAF7;
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.3s ease, border-color 0.3s ease, transform 0.15s ease;
  }
  .lock-btn:hover { background: rgba(20,16,28,0.65); border-color: rgba(255,255,255,0.28); }
  .lock-btn:active { transform: translateX(-50%) scale(0.97); }
  .lock-btn.active {
    background: rgba(196,88,58,0.22);
    border-color: rgba(216,140,90,0.5);
  }
  .lock-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(220,210,255,0.6);
    transition: background 0.3s ease;
  }
  .lock-btn.active .lock-dot {
    background: #E8905E;
    box-shadow: 0 0 10px rgba(232,144,94,0.8);
  }

  .cursor-dot {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(237,234,247,0.85);
    pointer-events: none;
    z-index: 10;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 0.2s ease;
    box-shadow: 0 0 12px rgba(237,234,247,0.6);
  }

  .footer-note {
    position: absolute;
    bottom: 2.5%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: rgba(120,115,140,0.6);
    text-transform: uppercase;
    z-index: 4;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="layer face-base"></div>
  <div class="layer mask-top" id="maskTop"></div>
  <div class="vignette"></div>
  <div class="grain"></div>

  <div class="hint">
    <div class="eyebrow">Hover to Unmask</div>
    <div class="name">ARMAN ACHARYA</div>
    <div class="rule"></div>
  </div>

  <div class="cursor-dot" id="cursorDot"></div>

  <button class="lock-btn" id="lockBtn">
    <span class="lock-dot"></span>
    <span id="lockLabel">Click to Lock</span>
  </button>

  <div class="footer-note">Unmask — Desktop Hero</div>
</div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const maskTop = document.getElementById('maskTop');
  const cursorDot = document.getElementById('cursorDot');
  const lockBtn = document.getElementById('lockBtn');
  const lockLabel = document.getElementById('lockLabel');

  let locked = false;
  let targetX = 0.5, targetY = 0.3;
  let curX = 0.5, curY = 0.3;
  let curRadius = 0;
  let targetRadius = 0;
  let rafRunning = false;

  function stageRect() { return stage.getBoundingClientRect(); }

  function setPointer(clientX, clientY) {
    const rect = stageRect();
    targetX = (clientX - rect.left) / rect.width;
    targetY = (clientY - rect.top) / rect.height;
    targetRadius = 260;

    cursorDot.style.left = (clientX - rect.left) + 'px';
    cursorDot.style.top = (clientY - rect.top) + 'px';
    cursorDot.style.opacity = locked ? '0' : '1';

    startLoop();
  }

  function releasePointer() {
    cursorDot.style.opacity = '0';
    if (locked) return;
    targetRadius = 0;
    startLoop();
  }

  function startLoop() {
    if (!rafRunning) {
      rafRunning = true;
      requestAnimationFrame(tick);
    }
  }

  function applyMask() {
    const cxPct = curX * 100;
    const cyPct = curY * 100;

    const grad = `radial-gradient(circle ${curRadius}px at ${cxPct}% ${cyPct}%, transparent 0%, transparent 62%, black 100%)`;
    maskTop.style.webkitMaskImage = grad;
    maskTop.style.maskImage = grad;
  }

  function tick() {
    const ease = 0.13;
    curX += (targetX - curX) * ease;
    curY += (targetY - curY) * ease;
    curRadius += (targetRadius - curRadius) * ease;

    applyMask();

    const stillMoving =
      Math.abs(targetRadius - curRadius) > 0.4 ||
      Math.abs(targetX - curX) > 0.0008 ||
      Math.abs(targetY - curY) > 0.0008;

    if (stillMoving) {
      requestAnimationFrame(tick);
    } else {
      rafRunning = false;
    }
  }

  stage.addEventListener('mousemove', (e) => {
    if (locked) { setPointer(e.clientX, e.clientY); return; }
    setPointer(e.clientX, e.clientY);
  });

  stage.addEventListener('mouseleave', () => {
    releasePointer();
  });

  lockBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    locked = !locked;
    lockBtn.classList.toggle('active', locked);
    lockLabel.textContent = locked ? 'Locked — Click to Reset' : 'Click to Lock';
    if (!locked) {
      releasePointer();
    }
  });

  applyMask();
})();
</script>

</body>
</html>
